body{

.page{

.subtitle{

  line-height:1.8;
  color:#665b58;
  margin-bottom:34px;
}

.whatsapp{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  min-height:62px;
  border-radius:18px;
  background:#25D366;
  color:#fff;
  text-decoration:none;
  font-size:19px;
  font-weight:800;
  box-shadow:0 10px 25px rgba(37,211,102,.25);
  transition:transform .12s,background .12s;
  -webkit-tap-highlight-color:transparent;
}

.whatsapp:active{
  transform:scale(.96);
  background:#1ebe5d;
}

.icon{
  width:25px;
  height:25px;
  fill:currentColor;
}

.note{
  font-size:13px;
  color:#8b817e;
  margin-top:15px;
}

.bottom{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 28px);
  max-width:450px;
  z-index:10;
}

.bottom a{
  min-height:56px;
  border-radius:17px;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
}

@media(min-width:600px){
  body{
    padding-bottom:40px;
  }

  .bottom{
    position:static;
    transform:none;
    margin:25px auto 0;
  }
}
</style>
