<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123C36">

<title>Glamour Beauty</title>
<meta name="description" content="Glamour Beauty - تواصلي معنا عبر واتساب">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;

  background:
    radial-gradient(
      circle at 50% 10%,
      #2d7569 0%,
      transparent 38%
    ),
    linear-gradient(
      145deg,
      #123C36 0%,
      #1A4B43 50%,
      #0E332F 100%
    );

  color:#fff;
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:24px 16px 90px;
}

.page{
  width:100%;
  max-width:480px;
  text-align:center;
}

.brand{
  font-size:29px;
  font-weight:800;
  letter-spacing:.5px;
  margin-bottom:12px;
}

.line{
  width:55px;
  height:3px;

  background:#25D366;
  border-radius:20px;

  margin:0 auto 30px;
}

h1{
  font-size:30px;
  line-height:1.35;
  margin-bottom:14px;
}

.subtitle{
  font-size:17px;
  line-height:1.8;

  color:#DCECE8;

  margin-bottom:34px;
}


/* =====================================
   الزر الأوسط الرئيسي
   زر حقيقي — بروز + ظل + ضغط
===================================== */

.page > .whatsapp{

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  width:105px;
  height:105px;

  margin:0 auto;
  padding:0;

  border-radius:50%;
  border:0;

  background:
    linear-gradient(
      145deg,
      #2ee873 0%,
      #25D366 55%,
      #20bd59 100%
    );

  color:#fff;
  text-decoration:none;

  /* بروز حقيقي */
  box-shadow:

    /* الحافة السفلية */
    0 5px 0 #179b49,

    /* الظل القريب */
    0 8px 10px rgba(0,0,0,.20),

    /* الظل المنتشر */
    0 16px 24px rgba(0,0,0,.18),

    /* إضاءة أعلى الزر */
    inset 0 2px 2px rgba(255,255,255,.30),

    /* عمق داخلي */
    inset 0 -3px 4px rgba(0,0,0,.10);

  transition:
    transform .10s ease,
    box-shadow .10s ease;

  -webkit-tap-highlight-color:transparent;

  cursor:pointer;
}


/* تأثير الضغط الحقيقي */

.page > .whatsapp:active{

  transform:
    translateY(5px)
    scale(.97);

  box-shadow:

    0 1px 0 #179b49,

    0 4px 8px rgba(0,0,0,.20),

    inset 0 2px 4px rgba(0,0,0,.12);
}


/* شعار واتساب الأوسط */

.page > .whatsapp .icon{

  width:44px;
  height:44px;

  fill:currentColor;

  display:block;
}


/* النص تحت الزر */

.note{
  font-size:13px;

  color:#BFD9D3;

  margin-top:15px;
}


/* =====================================
   الزر السفلي
   أكثر بروزًا وواضحًا
===================================== */

.bottom{

  position:fixed;

  bottom:14px;
  left:50%;

  transform:translateX(-50%);

  width:calc(100% - 28px);
  max-width:450px;

  z-index:10;
}


.bottom a{

  position:relative;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:9px;

  width:100%;

  min-height:56px;

  padding:0 18px;

  border-radius:17px;
  border:0;

  background:
    linear-gradient(
      145deg,
      #2ee873 0%,
      #25D366 55%,
      #20bd59 100%
    );

  color:#fff;

  text-decoration:none;

  font-size:18px;
  font-weight:800;

  /* بروز احترافي */
  box-shadow:

    /* الحافة السفلية */
    0 5px 0 #179b49,

    /* ظل قريب */
    0 8px 12px rgba(0,0,0,.22),

    /* ظل خارجي */
    0 16px 26px rgba(0,0,0,.17),

    /* إضاءة علوية */
    inset 0 2px 2px rgba(255,255,255,.28),

    /* عمق داخلي */
    inset 0 -3px 4px rgba(0,0,0,.10);

  transition:
    transform .10s ease,
    box-shadow .10s ease;

  -webkit-tap-highlight-color:transparent;

  cursor:pointer;
}


/* تأثير الضغط */

.bottom a:active{

  transform:
    translateY(5px)
    scale(.98);

  box-shadow:

    0 1px 0 #179b49,

    0 4px 8px rgba(0,0,0,.20),

    inset 0 2px 4px rgba(0,0,0,.12);
}


/* شعار واتساب السفلي */

.bottom .icon{

  width:26px;
  height:26px;

  fill:#fff;

  flex:none;

  display:block;
}


/* =====================================
   الشاشات الأكبر
===================================== */

@media(min-width:600px){

  body{
    padding-bottom:40px;
  }

  .bottom{

    position:static;

    transform:none;

    margin:25px auto 0;
  }
}

</style>
</head>


<body>


<main class="page">


  <div class="brand">

  </div>


  <div class="line"></div>

    </svg>

  </a>


  <div class="note">
    رد سريع عبر واتساب
  </div>


</main>


<!-- =================================
     الزر السفلي
================================== -->

<div class="bottom">


  <a

    href="https://wa.me/972567728417?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D8%8C%20%D8%B4%D8%A7%D9%87%D8%AF%D8%AA%20%D8%A5%D8%B9%D9%84%D8%A7%D9%86%D9%83%D9%85%20%D8%B9%D9%84%D9%89%20TikTok%20%D9%88%D8%A3%D8%B1%D8%BA%D8%A8%20%D8%A8%D9%85%D8%B9%D8%B1%D9%81%D8%A9%20%D8%A7%D9%84%D9%85%D8%B2%D9%8A%D8%AF."

    </svg>


    <span>

  </a>


</div>


<script>

function trackWhatsAppClick(){

  /*
    مكان إضافة TikTok Pixel لاحقًا:

</script>


</body>
</html>
