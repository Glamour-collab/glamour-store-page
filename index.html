<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كريم أبو هين 🎮 | ألعاب الأطفال</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
font-family:Tahoma,Arial,sans-serif;
background:#f5fbff;
color:#123b70;
overflow-x:hidden
}
button{font-family:inherit;cursor:pointer}

/* HEADER */
.header{
background:linear-gradient(135deg,#073d91,#0867c9);
min-height:78px;
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 5%;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 5px 20px #00347830
}
.logo{
color:#fff;
font-size:27px;
font-weight:900;
white-space:nowrap;
text-shadow:0 3px #06356f
}
.logo span{color:#ffd52e}
.nav{display:flex;gap:8px}
.nav a{
color:#fff;
text-decoration:none;
padding:12px 17px;
border-radius:30px;
font-weight:800
}
.nav a:hover,.nav .active{
background:#ffc72c;
color:#123b70
}
.search{
background:#fff;
border-radius:30px;
padding:10px 16px;
width:220px
}
.search input{
border:0;
outline:0;
width:100%;
font-family:inherit
}

/* HERO */
.hero{
min-height:510px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
overflow:hidden;
padding:45px 20px;
background:
radial-gradient(circle at 15% 20%,#fff 0 4%,transparent 4.5%),
radial-gradient(circle at 80% 15%,#fff 0 5%,transparent 5.5%),
linear-gradient(#25c5f3,#a3effb)
}
.hero-content{position:relative;z-index:3}
.small-title{
display:inline-block;
background:#ffbf18;
padding:10px 28px;
border-radius:13px;
font-size:21px;
font-weight:900;
box-shadow:0 6px #d8910c;
margin-bottom:20px
}
.hero h1{
font-size:clamp(50px,9vw,90px);
line-height:1;
color:white;
text-shadow:0 7px #0753a5,0 12px 20px #00347840;
margin-bottom:20px
}
.hero h1 span{color:#ffd72d}
.hero p{
font-size:23px;
font-weight:900;
color:#07519a;
margin-bottom:28px
}
.start-btn{
display:inline-block;
padding:16px 42px;
border-radius:50px;
background:linear-gradient(#159cff,#0870db);
color:#fff;
text-decoration:none;
font-size:21px;
font-weight:900;
border:4px solid white;
box-shadow:0 7px #0753a3
}
.toy{
position:absolute;
font-size:75px;
animation:float 3.5s ease-in-out infinite
}
.t1{left:7%;bottom:55px}
.t2{right:7%;bottom:55px}
.t3{left:17%;top:70px;font-size:45px}
.t4{right:17%;top:65px;font-size:50px}
@keyframes float{
50%{transform:translateY(-14px) rotate(3deg)}
}

/* SECTIONS */
.games-section{
padding:65px 5%;
background:#fff
}
.section-title{text-align:center;margin-bottom:40px}
.section-title h2{
font-size:40px;
color:#084c99;
margin-bottom:8px
}
.section-title p{color:#66809d;font-weight:600}
.line{
width:80px;height:7px;background:#ffc82e;
border-radius:20px;margin:14px auto
}

/* GAME CARDS */
.games-grid{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(6,1fr);
gap:18px
}
.game-card{
min-height:190px;
border:0;
border-radius:25px;
padding:20px 10px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
box-shadow:0 9px 20px #28649620;
transition:.25s
}
.game-card:hover{transform:translateY(-8px)}
.game-icon{font-size:62px;margin-bottom:10px}
.game-card h3{font-size:18px;font-weight:900}
.game-card .arrow{
margin-top:12px;
width:34px;height:34px;
border-radius:50%;
background:#126ce0;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:20px
}
.pink{background:#ffb3dc}
.green{background:#9aeb80}
.blue{background:#69d8ff}
.yellow{background:#ffd84c}
.purple{background:#bf8cff}
.cyan{background:#69ddd5}

/* FOOTER */
.footer{
background:#073875;
color:#fff;
padding:35px 5%;
text-align:center
}
.footer-logo{font-size:27px;font-weight:900}
.footer-logo span{color:#ffd52e}
.footer p{margin:10px 0 20px;color:#cce4ff}

/* GAME WINDOW */
.game-screen{
display:none;
position:fixed;
inset:0;
background:#0009;
z-index:3000;
align-items:center;
justify-content:center;
padding:15px
}
.game-screen.show{display:flex}
.game-box{
width:min(700px,100%);
max-height:92vh;
overflow:auto;
background:white;
border-radius:28px;
padding:22px;
box-shadow:0 20px 70px #0005;
position:relative
}
.close{
position:absolute;
top:12px;
left:12px;
width:42px;
height:42px;
border:0;
border-radius:50%;
background:#ef4444;
color:white;
font-size:24px;
font-weight:bold
}
.game-title{
text-align:center;
font-size:27px;
color:#0753a5;
margin:8px 45px 18px
}
.score{
text-align:center;
font-size:19px;
font-weight:bold;
margin-bottom:15px
}
.play-btn{
border:0;
background:#0879e8;
color:#fff;
padding:12px 25px;
border-radius:30px;
font-size:17px;
font-weight:bold
}

/* MEMORY */
.memory{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
max-width:480px;
margin:auto
}
.mem-card{
height:90px;
border:0;
border-radius:15px;
background:#167bdc;
color:white;
font-size:38px
}
.mem-card.open,.mem-card.done{background:#e9f6ff;color:#0753a5}

/* RACING */
.race{
height:330px;
background:#4d5560;
border-radius:20px;
position:relative;
overflow:hidden;
border:5px solid #26303a
}
.road-line{
position:absolute;
width:8px;
height:70px;
background:#fff;
left:50%;
transform:translateX(-50%);
animation:road 1s linear infinite
}
.l1{top:-70px}.l2{top:80px}.l3{top:230px}
@keyframes road{to{transform:translate(-50%,400px)}}
.car{
position:absolute;
bottom:18px;
left:calc(50% - 30px);
font-size:55px;
transition:.12s
}
.obstacle{
position:absolute;
top:-60px;
font-size:45px
}

/* ADVENTURE */
.adventure{
height:330px;
background:linear-gradient(#8be8ff,#dffbff);
border-radius:20px;
position:relative;
overflow:hidden
}
.player{
position:absolute;
bottom:20px;
left:30px;
font-size:50px
}
.star{
position:absolute;
font-size:35px;
cursor:pointer
}

/* DRAW */
.canvas-wrap{
text-align:center
}
#drawCanvas{
width:100%;
max-width:600px;
height:330px;
background:white;
border:4px solid #0879e8;
border-radius:18px;
touch-action:none
}
.colors{
display:flex;
justify-content:center;
gap:8px;
margin:12px
}
.color{
width:35px;height:35px;
border-radius:50%;
border:3px solid #fff;
box-shadow:0 1px 5px #0004
}
.clear{
border:0;
background:#ef4444;
color:#fff;
padding:9px 20px;
border-radius:20px
}

/* ANIMALS */
.animals{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px
}
.animal{
border:0;
background:#e9f8ff;
border-radius:20px;
padding:20px;
font-size:55px
}
.animal span{
display:block;
font-size:17px;
font-weight:bold;
color:#0753a5;
margin-top:7px
}

/* SPORT */
.sport{
text-align:center
}
.ball{
font-size:80px;
margin:25px;
display:inline-block;
transition:.2s
}
.goal{
font-size:100px;
margin-bottom:15px
}
.kick{
border:0;
background:#11a65b;
color:#fff;
padding:13px 30px;
border-radius:30px;
font-size:20px;
font-weight:bold
}

/* MOBILE */
@media(max-width:1000px){
.nav{display:none}
.header{justify-content:center}
.search{display:none}
.games-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:650px){
.hero h1{font-size:55px}
.hero p{font-size:18px}
.toy{font-size:50px}
.games-grid{grid-template-columns:repeat(2,1fr);gap:13px}
.game-card{min-height:160px}
.game-icon{font-size:50px}
.memory{gap:7px}
.mem-card{height:72px;font-size:30px}
.animals{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header class="header">
<div class="logo">👑 كريم <span>أبو هين</span> 🎮</div>

<nav class="nav">
<a href="#home" class="active">🏠 الرئيسية</a>
<a href="#games">🎮 الألعاب</a>
</nav>

<div class="search">
<input id="search" placeholder="ابحث عن لعبة...">
</div>
</header>

<section class="hero" id="home">
<div class="toy t1">🎮</div>
<div class="toy t2">🧸</div>
<div class="toy t3">⭐</div>
<div class="toy t4">🚀</div>

<div class="hero-content">
<div class="small-title">موقع الألعاب للأطفال</div>
<h1>كريم <span>أبو هين</span></h1>
<p>🎮 العب .. تعلم .. واستمتع 🎮</p>
<a class="start-btn" href="#games">ابدأ اللعب الآن 🎮</a>
</div>
</section>

<section class="games-section" id="games">

<div class="section-title">
<h2>🎮 ألعاب كريم أبو هين</h2>
<p>اختر لعبة وابدأ اللعب فورًا — بدون تحميل</p>
<div class="line"></div>
</div>

<div class="games-grid">

<button class="game-card pink" data-game="memory">
<div class="game-icon">🧩</div>
<h3>ألعاب الذكاء</h3>
<div class="arrow">←</div>
</button>

<button class="game-card green" data-game="race">
<div class="game-icon">🏎️</div>
<h3>ألعاب السباق</h3>
<div class="arrow">←</div>
</button>

<button class="game-card blue" data-game="adventure">
<div class="game-icon">🚀</div>
<h3>ألعاب المغامرات</h3>
<div class="arrow">←</div>
</button>

<button class="game-card yellow" data-game="draw">
<div class="game-icon">🎨</div>
<h3>ألعاب الرسم</h3>
<div class="arrow">←</div>
</button>

<button class="game-card purple" data-game="animals">
<div class="game-icon">🦁</div>
<h3>ألعاب الحيوانات</h3>
<div class="arrow">←</div>
</button>

<button class="game-card cyan" data-game="sport">
<div class="game-icon">⚽</div>
<h3>ألعاب الرياضة</h3>
<div class="arrow">←</div>
</button>

</div>
</section>

<footer class="footer">
<div class="footer-logo">👑 كريم <span>أبو هين</span> 🎮</div>
<p>مع كريم أبو هين .. كل يوم مغامرة جديدة ⭐</p>
</footer>


<!-- GAME WINDOW -->
<div class="game-screen" id="gameScreen">
<div class="game-box">

<button class="close" id="closeGame">×</button>

<div id="gameContent"></div>

</div>
</div>


<script>
const screen=document.getElementById("gameScreen");
const content=document.getElementById("gameContent");
const closeGame=document.getElementById("closeGame");

document.querySelectorAll(".game-card").forEach(card=>{
card.addEventListener("click",()=>{
openGame(card.dataset.game);
});
});

closeGame.addEventListener("click",close);
screen.addEventListener("click",e=>{
if(e.target===screen) close();
});

function close(){
screen.classList.remove("show");
content.innerHTML="";
}

/* ================= OPEN GAME ================= */

function openGame(game){
screen.classList.add("show");

if(game==="memory") memoryGame();
if(game==="race") raceGame();
if(game==="adventure") adventureGame();
if(game==="draw") drawGame();
if(game==="animals") animalsGame();
if(game==="sport") sportGame();
}


/* ================= MEMORY ================= */

function memoryGame(){

const emojis=["🐶","🐱","🦁","🐸","🐶","🐱","🦁","🐸"];
let cards=[...emojis].sort(()=>Math.random()-.5);
let first=null;
let lock=false;
let found=0;

content.innerHTML=`
<h2 class="game-title">🧩 لعبة الذاكرة</h2>
<div class="score">اعثر على الأزواج المتشابهة ⭐</div>
<div class="memory" id="memoryBoard"></div>
<div style="text-align:center;margin-top:18px">
<button class="play-btn" id="memoryRestart">🔄 لعبة جديدة</button>
</div>
`;

const board=document.getElementById("memoryBoard");

function build(){
board.innerHTML="";
first=null;
lock=false;
found=0;

cards.sort(()=>Math.random()-.5);

cards.forEach((emoji,i)=>{
const btn=document.createElement("button");
btn.className="mem-card";
btn.textContent="❓";
btn.dataset.value=emoji;

btn.addEventListener("click",()=>{
if(lock||btn.classList.contains("open")||btn.classList.contains("done"))return;

btn.textContent=emoji;
btn.classList.add("open");

if(!first){
first=btn;
return;
}

lock=true;

if(first.dataset.value===btn.dataset.value){

first.classList.add("done");
btn.classList.add("done");
found++;
first=null;
lock=false;

if(found===4){
setTimeout(()=>{
alert("🎉 أحسنت! وجدت جميع الأزواج!");
},200);
}

}else{

setTimeout(()=>{
first.textContent="❓";
btn.textContent="❓";
first.classList.remove("open");
btn.classList.remove("open");
first=null;
lock=false;
},650);

}
});

board.appendChild(btn);
});
}

build();

document.getElementById("memoryRestart").onclick=build;
}


/* ================= RACING ================= */

function raceGame(){

content.innerHTML=`
<h2 class="game-title">🏎️ سباق السيارات</h2>
<div class="score">حرّك السيارة يمينًا ويسارًا وتجنب السيارات 🚗</div>

<div class="race" id="race">
<div class="road-line l1"></div>
<div class="road-line l2"></div>
<div class="road-line l3"></div>
<div class="car" id="car">🏎️</div>
</div>

<div style="text-align:center;margin-top:15px">
<button class="play-btn" id="startRace">▶️ ابدأ السباق</button>
</div>
`;

const road=document.getElementById("race");
const car=document.getElementById("car");
let running=false;
let x=50;
let obstacle=null;
let timer=null;
let score=0;

function move(direction){
if(!running)return;
x+=direction*7;
x=Math.max(5,Math.min(87,x));
car.style.left=x+"%";
}

road.addEventListener("pointerdown",e=>{
const rect=road.getBoundingClientRect();
move(e.clientX<rect.left+rect.width/2?-1:1);
});

document.addEventListener("keydown",keyboard);

function keyboard(e){
if(!running)return;
if(e.key==="ArrowLeft")move(-1);
if(e.key==="ArrowRight")move(1);
}

function start(){

running=true;
score=0;
x=50;
car.style.left=x+"%";

if(obstacle) obstacle.remove();

obstacle=document.createElement("div");
obstacle.className="obstacle";
obstacle.textContent="🚙";
road.appendChild(obstacle);

let oy=-60;

clearInterval(timer);

timer=setInterval(()=>{

oy+=6;
obstacle.style.top=oy+"px";

const carRect=car.getBoundingClientRect();
const obsRect=obstacle.getBoundingClientRect();

if(
carRect.left<obsRect.right &&
carRect.right>obsRect.left &&
carRect.top<obsRect.bottom &&
carRect.bottom>obsRect.top
){
running=false;
clearInterval(timer);
alert("💥 اصطدمت! حاول مرة أخرى 😄");
}

if(oy>road.clientHeight){
oy=-60;
score++;
obstacle.style.left=(10+Math.random()*80)+"%";
}

},30);
}

document.getElementById("startRace").onclick=start;

}


/* ================= ADVENTURE ================= */

function adventureGame(){

content.innerHTML=`
<h2 class="game-title">🚀 مغامرة النجوم</h2>
<div class="score">اضغط على النجوم واجمع 10 نجوم ⭐</div>

<div class="adventure" id="adventure">
<div class="player">🚀</div>
</div>

<div style="text-align:center;margin-top:15px">
<button class="play-btn" id="newAdventure">🔄 مغامرة جديدة</button>
</div>
`;

const area=document.getElementById("adventure");
let score=0;

function createStar(){

const star=document.createElement("button");
star.className="star";
star.textContent="⭐";
star.style.border="0";
star.style.background="transparent";
star.style.left=(5+Math.random()*88)+"%";
star.style.top=(5+Math.random()*75)+"%";

star.addEventListener("click",()=>{
score++;
star.remove();

if(score>=10){
alert("🎉 رائع! جمعت 10 نجوم!");
score=0;
createStars();
}
});

area.appendChild(star);
}

function createStars(){
area.querySelectorAll(".star").forEach(x=>x.remove());
score=0;
for(let i=0;i<5;i++)createStar();
}

createStars();

document.getElementById("newAdventure").onclick=createStars;
}


/* ================= DRAW ================= */

function drawGame(){

content.innerHTML=`
<h2 class="game-title">🎨 ارسم لوحتك</h2>
<div class="canvas-wrap">

<canvas id="drawCanvas" width="600" height="330"></canvas>

<div class="colors">
<button class="color" style="background:#ef4444" data-color="#ef4444"></button>
<button class="color" style="background:#0879e8" data-color="#0879e8"></button>
<button class="color" style="background:#16a34a" data-color="#16a34a"></button>
<button class="color" style="background:#f59e0b" data-color="#f59e0b"></button>
<button class="color" style="background:#9333ea" data-color="#9333ea"></button>
</div>

<button class="clear" id="clearCanvas">🗑️ مسح الرسم</button>

</div>
`;

const canvas=document.getElementById("drawCanvas");
const ctx=canvas.getContext("2d");

ctx.lineWidth=7;
ctx.lineCap="round";
ctx.strokeStyle="#0879e8";

let drawing=false;

function position(e){
const rect=canvas.getBoundingClientRect();

return{
x:(e.clientX-rect.left)*canvas.width/rect.width,
y:(e.clientY-rect.top)*canvas.height/rect.height
};
}

canvas.addEventListener("pointerdown",e=>{
drawing=true;
canvas.setPointerCapture(e.pointerId);
const p=position(e);
ctx.beginPath();
ctx.moveTo(p.x,p.y);
});

canvas.addEventListener("pointermove",e=>{
if(!drawing)return;
const p=position(e);
ctx.lineTo(p.x,p.y);
ctx.stroke();
});

canvas.addEventListener("pointerup",()=>drawing=false);
canvas.addEventListener("pointercancel",()=>drawing=false);

document.querySelectorAll(".color").forEach(btn=>{
btn.addEventListener("click",()=>{
ctx.strokeStyle=btn.dataset.color;
});
});

document.getElementById("clearCanvas").onclick=()=>{
ctx.clearRect(0,0,canvas.width,canvas.height);
};
}


/* ================= ANIMALS ================= */

function animalsGame(){

const animals=[
["🐶","الكلب","نباح 🐕"],
["🐱","القطة","مواء 🐈"],
["🐮","البقرة","موو 🐄"],
["🦁","الأسد","زئير 🦁"],
["🐸","الضفدع","نقيق 🐸"],
["🐔","الدجاجة","صياح 🐔"]
];

content.innerHTML=`
<h2 class="game-title">🦁 أصوات الحيوانات</h2>
<div class="score">اضغط على الحيوان لتتعرف على صوته</div>
<div class="animals" id="animals"></div>
`;

const box=document.getElementById("animals");

animals.forEach(a=>{

const btn=document.createElement("button");
btn.className="animal";
btn.innerHTML=`${a[0]}<span>${a[1]}</span>`;

btn.addEventListener("click",()=>{
alert(`${a[0]} ${a[1]}\nصوته: ${a[2]}`);
});

box.appendChild(btn);

});
}


/* ================= SPORT ================= */

function sportGame(){

content.innerHTML=`
<h2 class="game-title">⚽ تحدي ركلة الجزاء</h2>

<div class="sport">
<div class="goal">🥅</div>
<div class="ball" id="ball">⚽</div>
<br>
<button class="kick" id="kick">⚽ اركل الكرة!</button>

<div class="score" id="sportScore" style="margin-top:20px">
الأهداف: 0
</div>
</div>
`;

const ball=document.getElementById("ball");
const scoreText=document.getElementById("sportScore");
const kick=document.getElementById("kick");

let score=0;

kick.addEventListener("click",()=>{

ball.style.transform="translateY(-120px) scale(.8) rotate(360deg)";

setTimeout(()=>{

const goal=Math.random()>.35;

if(goal){
score++;
alert("⚽ جوووول! أحسنت!");
}else{
alert("😄 حاول مرة أخرى!");
}

scoreText.textContent="الأهداف: "+score;

ball.style.transform="";

},500);

});
}


/* ================= SEARCH ================= */

document.getElementById("search").addEventListener("input",function(){

const value=this.value.trim();

document.querySelectorAll(".game-card").forEach(card=>{

const title=card.querySelector("h3").textContent;

card.style.display=
!value || title.includes(value)
?"flex":"none";

});

});
</script>

</body>
</html>
