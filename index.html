<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0752a5">
<title>كريم أبو هين 🎮 | ألعاب الأطفال</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Tahoma","Arial",sans-serif;
    background:#f5fbff;
    color:#123b70;
    overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(135deg,#073d91,#0867c9);
    min-height:82px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 5%;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 5px 20px rgba(0,50,120,.2);
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
    color:white;
    font-size:27px;
    font-weight:900;
    white-space:nowrap;
    text-shadow:0 3px 0 #06356f;
}

.logo span{
    color:#ffd52e;
}

.crown{
    font-size:30px;
}

.nav{
    display:flex;
    align-items:center;
    gap:12px;
}

.nav a{
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:30px;
    font-weight:800;
    transition:.25s;
}

.nav a:hover{
    background:rgba(255,255,255,.16);
    transform:translateY(-2px);
}

.nav .active{
    background:#ffc72c;
    color:#123b70;
    box-shadow:0 5px 12px rgba(0,0,0,.15);
}

.search{
    background:white;
    border-radius:30px;
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:8px;
    width:220px;
}

.search input{
    border:0;
    outline:0;
    width:100%;
    font-family:inherit;
    font-size:14px;
}

/* ================= HERO ================= */

.hero{
    min-height:540px;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 15% 25%,#fff 0 4%,transparent 4.5%),
        radial-gradient(circle at 80% 18%,#fff 0 5%,transparent 5.5%),
        linear-gradient(180deg,#2ac8f5 0%,#7ee6fa 65%,#e9fbff 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:50px 5%;
}

.hero:before,
.hero:after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.25);
}

.hero:before{
    width:400px;
    height:150px;
    top:70px;
    left:-100px;
}

.hero:after{
    width:450px;
    height:170px;
    top:100px;
    right:-120px;
}

    z-index:3;
